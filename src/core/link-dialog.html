<dialog data-selector="lite-editor-link-dialog" class="\{classNames.LiteEditorLinkDialog\}">
	<span class="\{classNames.LiteEditorBtnCloseWrap\}">
		<span class="\{classNames.LiteEditorBtnCloseLabel\}">\{message.closeLabel\}</span>
		<button type="button" data-action-click="closeLinkDialog()" class="\{classNames.LiteEditorBtn\} \{classNames.LiteEditorBtnClose\}">
			<i class="\{classNames.LiteEditorFontClose\}"></i>
		</button>
	</span>
	<!-- BEGIN linkNew:exist -->
	<h2 class="\{classNames.LiteEditorLinkDialogTitle\}">
		<i class="\{classNames.LiteEditorFontLink\}"></i>\{message.addLinkTitle\}</h2>
	<!-- END linkNew:exist -->
	<!-- BEGIN linkNew:empty -->
	<h2 class="\{classNames.LiteEditorLinkDialogTitle\}">
		<i class="\{classNames.LiteEditorFontLink\}"></i>\{message.updateLinkTitle\}</h2>
	<!-- END linkNew:empty -->
	<div class="\{classNames.LiteEditorLinkDialogBody\}">
		<table class="\{classNames.LiteEditorLinkDialogTable\}">
			<tr>
				<th>\{message.linkLabel\}</th>
				<td>
					<input type="text" data-bind="linkLabel" class="\{classNames.LiteEditorLinkDialogInput\}" data-action-keydown="preventSubmit()">
				</td>
			</tr>
			<tr>
				<th>\{message.linkUrl\}</th>
				<td>
					<input type="text" data-bind="linkUrl" class="\{classNames.LiteEditorLinkDialogInput\}" data-action-keydown="preventSubmit()">
				</td>
			</tr>
			<tr>
				<th>\{message.targetBlank\}</th>
				<td>
					<label>
					<input type="checkbox" data-bind="targetBlank" value="true" data-action-change="updateTargetBlank">
					\{message.targetBlankLabel\}
					</label>
				</td>
			</tr>

			<tr>
				<td></td>
				<td>
					<!-- BEGIN linkNew:exist -->
					<button type="button" data-action-click="insertAtag()" class="\{classNames.LiteEditorBtn\}">
						<i class="\{classNames.LiteEditorFontLink\}"></i>
						\{message.addLink\}
					</button>
					<!-- END linkNew:exist -->

					<!-- BEGIN linkNew:empty -->
					<button type="button" data-action-click="updateLink()" class="\{classNames.LiteEditorBtn\}">
						<i class="\{classNames.LiteEditorFontUpdate\}"></i>
						\{message.updateLink\}
					</button>
					<button type="button" data-action-click="removeLink()" class="\{classNames.LiteEditorBtn\}">
						<i class="\{classNames.LiteEditorFontRemove\}"></i>
						\{message.removeLink\}
					</button>
					<!-- END linkNew:empty -->
				</td>
			</tr>
		</table>
	</div>
</dialog>
